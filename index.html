(function(){

function read(k){try{return localStorage.getItem('roosee-bright-'+k)||'0'}catch(e){return '0'}}
function write(k,v){try{localStorage.setItem('roosee-bright-'+k,v)}catch(e){}}
function file(type,n){return 'assets/'+type+'/'+(type==='backgrounds'?'bg-':'logo-')+String(n).padStart(2,'0')+'.svg'}
function apply(){
const bg=Number(read('background')),btn=Number(read('button')),lg=Number(read('logo'));
app.classList.toggle('custom-bg',bg>0);app.classList.toggle('custom-button',btn>0);app.classList.toggle('custom-logo',lg>0);
if(bg)app.style.setProperty('--custom-bg','url("'+file('backgrounds',bg)+'")');
if(btn){const c=colors[btn-1];app.style.setProperty('--custom-button','linear-gradient(100deg,'+c[0]+','+c[1]+')');app.style.setProperty('--custom-button-text',c[2])}
logo.innerHTML=lg?'<img src="'+file('logos',lg)+'" alt="ROOSEE">':'<span>R</span>';
document.querySelectorAll('.choice[data-type]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.id)===Number(read(b.dataset.type))));
}
[['background','backgrounds'],['button','buttons'],['logo','logos']].forEach(([type,id])=>{

else if(n){const im=document.createElement('img');im.src=file(type==='background'?'backgrounds':'logos',n);im.alt=names[n-1];im.loading='lazy';b.appendChild(im)}
else{const p=document.createElement('div');p.className='button-preview';p.style.background='linear-gradient(130deg,#fff,#bdeaff)';p.style.color='#0062c6';p.textContent='Bright Blue';b.appendChild(p)}
