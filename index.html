   var colors=[['#fff','#e8f9ff','#0751ae'],['#009aff','#0657fa','#fff'],['#fafffa','#e8ffec','#07843d'],['#f71ff3','#0877ff','#fff'],['#ffa900','#ff5800','#fff'],['#36c3ff','#0064ff','#fff']][n-1];
   var sw=document.createElement('div');sw.className='button-swatch';sw.style.background='linear-gradient(100deg,'+colors[0]+','+colors[1]+')';sw.style.color=colors[2];sw.textContent='Mở ROOSEE';b.appendChild(sw);
  }else{var img=document.createElement('img');img.loading='lazy';img.alt=titles[n-1];img.src=path(folder,n);b.appendChild(img)}
  var label=document.createElement('span');label.textContent=String(n).padStart(2,'0')+' · '+titles[n-1];b.appendChild(label);
  b.addEventListener('click',function(){put(this.dataset.kind,this.dataset.id);apply()});root.appendChild(b);
 }
});
apply();
})();
